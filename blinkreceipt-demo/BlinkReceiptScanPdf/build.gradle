plugins {
    alias(libs.plugins.android.application)
}

def versionMajor = libs.versions.versionMajor.get().toInteger()
def versionMinor = libs.versions.versionMinor.get().toInteger()
def versionPatch = libs.versions.versionPatch.get().toInteger()

android {
    namespace 'com.blinkreceipt.scan.pdf'
    compileSdkVersion libs.versions.compileSdk.get().toInteger()
    buildToolsVersion libs.versions.buildTools.get()

    defaultConfig {
        applicationId "com.blinkreceipt.scan.pdf"
        minSdkVersion libs.versions.minSdk.get().toInteger()
        targetSdkVersion libs.versions.targetSdk.get().toInteger()
        versionCode versionMajor * 10000 + versionMinor * 1000 + versionPatch * 100
        versionName "${versionMajor}.${versionMinor}.${versionPatch}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        viewBinding true
    }

    signingConfigs {
        release {
            storeFile file("../blink-receipt-demos.jsk")
            storePassword providers.gradleProperty('demoStorePassword').get()
            keyAlias providers.gradleProperty('demoKeyAlias').get()
            keyPassword providers.gradleProperty('demoKeyPassword').get()
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation libs.logcat
    implementation libs.androidx.recyclerview
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.play.services.tasks

    implementation platform(libs.blinkreceipt.bom)
    implementation libs.blinkreceipt.recognizer

    testImplementation libs.junit

    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.espresso.core
}
