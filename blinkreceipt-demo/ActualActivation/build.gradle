plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
}

def versionMajor = libs.versions.versionMajor.get().toInteger()
def versionMinor = libs.versions.versionMinor.get().toInteger()
def versionPatch = libs.versions.versionPatch.get().toInteger()

android {
    namespace 'com.actualplatform.android.activation.development'
    compileSdkVersion libs.versions.compileSdk.get().toInteger()
    buildToolsVersion libs.versions.buildTools.get()

    defaultConfig {
        applicationId "com.actualplatform.android.activation.development"
        minSdkVersion libs.versions.minSdk.get().toInteger()
        targetSdkVersion libs.versions.targetSdk.get().toInteger()

        versionCode versionMajor * 10000 + versionMinor * 1000 + versionPatch * 100
        versionName "${versionMajor}.${versionMinor}.${versionPatch}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose true
    }

    signingConfigs {
        release {
            storeFile file("../blink-receipt-demos.jsk")
            storePassword providers.gradleProperty('demoStorePassword').get()
            keyAlias providers.gradleProperty('demoKeyAlias').get()
            keyPassword providers.gradleProperty('demoKeyPassword').get()
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += [
                    'META-INF/NOTICE.md',
                    'META-INF/LICENSE.md',
                    'META-INF/ASL2.0',
                    'META-INF/AL2.0',
                    'META-INF/LGPL2.1',
                    'META-INF/licenses/ASM',
                    'META-INF/DEPENDENCIES',
            ]
        }
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material.icons.core
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
    androidTestImplementation libs.androidx.compose.ui.test.junit4

    implementation platform(libs.blinkreceipt.bom)
    implementation libs.blinkreceipt.recognizer
    implementation libs.blinkreceipt.camera.ui
    implementation libs.blinkreceipt.logcat

    implementation platform(libs.activation.bom)
    implementation libs.activation

    implementation libs.androidx.work.runtime
    implementation libs.androidx.work.runtime.ktx

    implementation libs.androidx.navigation3.runtime
    implementation libs.androidx.navigation3.ui
    implementation libs.androidx.lifecycle.viewmodel.navigation3

    // Activation theming editor (DataStore persistence, color picker dialog, icon thumbnails)
    implementation libs.androidx.datastore.preferences
    implementation libs.colorpicker.compose
    implementation libs.coil.compose

    implementation libs.okio
    implementation libs.gson

    testImplementation libs.junit

    implementation libs.kotlinx.serialization.json

    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
}
