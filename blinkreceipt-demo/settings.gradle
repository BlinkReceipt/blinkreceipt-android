pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        // Locally published SDK builds (publishToMavenLocal) take precedence.
        mavenLocal {
            content {
                includeGroupAndSubgroups("com.microblink.blinkreceipt")
                includeGroupAndSubgroups("com.actualplatform")
            }
        }
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        // -SNAPSHOT builds of the BlinkReceipt and Activation SDKs published to Maven Central.
        maven {
            name = "mavenCentralSnapshots"
            url = uri("https://central.sonatype.com/repository/maven-snapshots/")
            mavenContent {
                snapshotsOnly()
                includeGroupAndSubgroups("com.microblink.blinkreceipt")
                includeGroupAndSubgroups("com.actualplatform")
            }
        }
        mavenCentral()
    }
}

include ':BlinkReceiptEarnings'
include ':BlinkReceiptImap'
include ':BlinkReceiptOutlook'
include ':BlinkReceiptStaticScan'
include ':ActualActivation'
include ':BlinkReceiptCustomScan'
include ':BlinkReceiptSurveys'
include ':BlinkReceiptAccountLinking'
include ':BlinkReceiptScanPdf'
