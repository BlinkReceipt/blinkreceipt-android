[versions]
# Android build configuration
minSdk = "24"
compileSdk = "37"
targetSdk = "36"
buildTools = "37.0.0"

# Demo app version (versionCode / versionName are derived from these)
versionMajor = "2"
versionMinor = "3"
versionPatch = "1"

# Build tooling
agp = "9.3.1"
kotlin = "2.2.21"

# AndroidX
androidxActivityCompose = "1.13.0"
androidxAppcompat = "1.7.1"
androidxComposeBom = "2026.05.00"
androidxConstraintlayout = "2.2.1"
androidxCore = "1.19.0"
androidxDatastore = "1.2.1"
androidxFragment = "1.8.6"
androidxLifecycle = "2.11.0-beta01"
androidxLifecycleViewmodelNav3 = "2.10.0"
androidxNavigation3 = "1.0.1"
androidxRecyclerview = "1.3.2"
androidxWork = "2.11.2"

# Test
androidxTestEspresso = "3.7.0"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"
junit = "4.13.2"

# BlinkReceipt / Actual Platform
blinkreceiptBom = "2.3.1"
activationBom = "1.1.1"

# Third party
barcodeScanning = "17.3.0"
coil = "3.5.0-beta01"
colorPicker = "1.1.2"
easyPermissions = "3.0.0"
gson = "2.14.0"
kotlinxSerialization = "1.10.0"
logcat = "0.1"
material = "1.13.0"
msal = "5.10.2"
okio = "3.10.2"
playServicesTasks = "18.2.0"

[libraries]
# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidxConstraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidxFragment" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidxLifecycleViewmodelNav3" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidxNavigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "androidxNavigation3" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerview" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidxWork" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWork" }

# Compose (versions come from the Compose BOM)
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

# Test
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit = { module = "junit:junit", version.ref = "junit" }

# BlinkReceipt (versions come from the BlinkReceipt BOM)
blinkreceipt-bom = { module = "com.microblink.blinkreceipt:blinkreceipt-bom", version.ref = "blinkreceiptBom" }
blinkreceipt-account-linking = { module = "com.microblink.blinkreceipt:blinkreceipt-account-linking" }
blinkreceipt-camera-ui = { module = "com.microblink.blinkreceipt:blinkreceipt-camera-ui" }
blinkreceipt-digital = { module = "com.microblink.blinkreceipt:blinkreceipt-digital" }
blinkreceipt-earnings = { module = "com.microblink.blinkreceipt:blinkreceipt-earnings" }
blinkreceipt-logcat = { module = "com.microblink.blinkreceipt:blinkreceipt-logcat" }
blinkreceipt-recognizer = { module = "com.microblink.blinkreceipt:blinkreceipt-recognizer" }
blinkreceipt-surveys = { module = "com.microblink.blinkreceipt:blinkreceipt-surveys" }

# Actual Platform Activation (versions come from the Activation BOM)
activation-bom = { module = "com.actualplatform:activation-bom", version.ref = "activationBom" }
activation = { module = "com.actualplatform:activation" }

# Third party
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
colorpicker-compose = { module = "com.github.skydoves:colorpicker-compose", version.ref = "colorPicker" }
easypermissions = { module = "pub.devrel:easypermissions", version.ref = "easyPermissions" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
logcat = { module = "com.squareup.logcat:logcat", version.ref = "logcat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "barcodeScanning" }
msal = { module = "com.microsoft.identity.client:msal", version.ref = "msal" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
play-services-tasks = { module = "com.google.android.gms:play-services-tasks", version.ref = "playServicesTasks" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
