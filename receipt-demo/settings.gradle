pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        // Locally published SDK builds (publishToMavenLocal) take precedence.
        mavenLocal {
            content {
                includeGroupAndSubgroups("com.actualplatform")
            }
        }
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        // -SNAPSHOT builds of the Receipt and Activation SDKs published to Maven Central.
        maven {
            name = "mavenCentralSnapshots"
            url = uri("https://central.sonatype.com/repository/maven-snapshots/")
            mavenContent {
                snapshotsOnly()
                includeGroupAndSubgroups("com.actualplatform")
            }
        }
        mavenCentral()
    }
}

include ':ReceiptEarnings'
include ':ReceiptImap'
include ':ReceiptOutlook'
include ':ReceiptStaticScan'
include ':ActualActivation'
include ':ReceiptCustomScan'
include ':ReceiptSurveys'
include ':ReceiptAccountLinking'
include ':ReceiptScanPdf'
