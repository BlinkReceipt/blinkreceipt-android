[versions]
# Android build configuration
minSdk = "24"
compileSdk = "37"
targetSdk = "36"
buildTools = "37.0.0"

# Demo app version (versionCode / versionName are derived from these)
versionMajor = "3"
versionMinor = "0"
versionPatch = "0"

# Build tooling
agp = "9.5.1"
kotlin = "2.4.21"

# AndroidX
androidxActivityCompose = "1.13.0"
androidxAppcompat = "1.8.0"
androidxComposeBom = "2026.09.00"
# Floor for material3 in ActualActivation. Activation 1.3.2-SNAPSHOT pulls material3 1.5.0-alpha17,
# which was compiled against foundation 1.11's Style API; composeBom's foundation 1.12.1 changed it.
# Matches windfall-android-sdk. Drop once Activation ships a material3 built against foundation 1.12.
androidxComposeMaterial3ForActivation = "1.5.0-rc01"
androidxConstraintlayout = "2.2.2"
androidxCore = "1.19.1"
androidxDatastore = "1.3.0"
androidxFragment = "1.9.1"
androidxLifecycle = "2.11.0"
androidxNavigation3 = "1.2.1"
androidxRecyclerview = "1.4.0"
androidxWork = "2.12.0"

# Test
androidxTestEspresso = "3.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
junit = "4.13.2"

# Receipt / Actual Platform
receiptBom = "3.0.0-20261113.121838-1"
activationBom = "1.3.2-SNAPSHOT"

# Third party
barcodeScanning = "17.3.0"
coil = "3.6.3"
colorPicker = "1.3.0"
easyPermissions = "3.0.0"
gson = "2.15.0"
kotlinxSerialization = "1.12.0"
logcat = "0.4"
material = "1.14.0"
msal = "8.6.0"
okio = "3.18.2"
playServicesTasks = "18.4.1"

[libraries]
# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidxConstraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidxFragment" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidxLifecycle" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidxNavigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "androidxNavigation3" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerview" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidxWork" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWork" }

# Compose (versions come from the Compose BOM)
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material3-forActivation = { module = "androidx.compose.material3:material3", version.ref = "androidxComposeMaterial3ForActivation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

# Test
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit = { module = "junit:junit", version.ref = "junit" }

# Receipt (versions come from the Receipt BOM)
receipt-bom = { module = "com.actualplatform:receipt-bom", version.ref = "receiptBom" }
receipt-account-linking = { module = "com.actualplatform:receipt-account-linking" }
receipt-camera-ui = { module = "com.actualplatform:receipt-camera-ui" }
receipt-digital = { module = "com.actualplatform:receipt-digital" }
receipt-earnings = { module = "com.actualplatform:receipt-earnings" }
receipt-logcat = { module = "com.actualplatform:receipt-logcat" }
receipt-recognizer = { module = "com.actualplatform:receipt-recognizer" }
receipt-surveys = { module = "com.actualplatform:receipt-surveys" }

# Actual Platform Activation (versions come from the Activation BOM)
activation-bom = { module = "com.actualplatform:activation-bom", version.ref = "activationBom" }
activation = { module = "com.actualplatform:activation" }

# Third party
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
colorpicker-compose = { module = "com.github.skydoves:colorpicker-compose", version.ref = "colorPicker" }
easypermissions = { module = "pub.devrel:easypermissions", version.ref = "easyPermissions" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
logcat = { module = "com.squareup.logcat:logcat", version.ref = "logcat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "barcodeScanning" }
msal = { module = "com.microsoft.identity.client:msal", version.ref = "msal" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
play-services-tasks = { module = "com.google.android.gms:play-services-tasks", version.ref = "playServicesTasks" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
